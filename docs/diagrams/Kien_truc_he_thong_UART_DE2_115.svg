</text>
<text x="1450" y="1110" font-size="17" fill="#245d85" text-anchor="start" font-weight="normal">
<tspan x="1450" dy="0">Phản hồi: PRDATA[31:0], PREADY, PSLVERR</tspan>
</text>
<text x="55" y="1473" font-size="21" fill="#52687c" text-anchor="start" font-weight="normal">
<tspan x="55" dy="0">Xanh dương: bus / dữ liệu  •  Xanh lá: UART nối tiếp  •  Xanh ngọc: tick  •  Nét đứt hồng: interrupt</tspan>
</text>
<text x="55" y="1510" font-size="18" fill="#52687c" text-anchor="start" font-weight="normal">
<tspan x="55" dy="0">Lược phần nạp/debug và console JTAG; lược dây CFG / status / flow-control chi tiết. FIFO nằm trong Register File; các khối ngoại vi là nhánh song song của Avalon.</tspan>
</text>
